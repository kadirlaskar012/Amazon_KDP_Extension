<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="45%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="25%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Left Book Wing Gradient -->
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Right Book Wing Gradient -->
    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Page Layers Gradient -->
    <linearGradient id="pageLayerLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="pageLayerRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Gold / Amber Accent for Niche Star & Growth -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Cyan Energy Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Chart Bar 1 Gradient -->
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Chart Bar 2 Gradient -->
    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Chart Bar 3 Gradient -->
    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowDepth" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle Badge with Glow & Border -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bgGrad)" filter="url(#shadowDepth)" />
  <rect x="28" y="28" width="456" height="456" rx="112" stroke="url(#rimGrad)" stroke-width="12" stroke-opacity="0.9" />

  <!-- Inner Soft Ambient Glow -->
  <circle cx="256" cy="230" r="160" fill="#6366F1" fill-opacity="0.12" filter="blur(40px)" />
  <circle cx="256" cy="150" r="100" fill="#F59E0B" fill-opacity="0.15" filter="blur(35px)" />

  <!-- Glass Arc Specular Highlight on Top Edge -->
  <path d="M72 136 C110 76 180 44 256 44 C332 44 402 76 440 136 C376 112 316 100 256 100 C196 100 136 112 72 136 Z" fill="#FFFFFF" fill-opacity="0.06" />

  <!-- Orbiting Search / Radar Ring (Symbolizing Niche Research) -->
  <ellipse cx="256" cy="275" rx="180" ry="52" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-dasharray="14 10" stroke-opacity="0.45" transform="rotate(-18 256 275)" />

  <!-- Behind Book: Growth Analytics Chart Bars (Emerging from Knowledge to High Profit) -->
  <g filter="url(#shadowDepth)">
    <!-- Bar 1 (Left: Niche Demand) -->
    <rect x="184" y="205" width="34" height="75" rx="8" fill="url(#bar1Grad)" />
    <!-- Bar 2 (Center: Keyword Search Volume) -->
    <rect x="239" y="160" width="34" height="120" rx="8" fill="url(#bar2Grad)" />
    <!-- Bar 3 (Right: Royalty / Sales Rank Velocity) -->
    <rect x="294" y="125" width="34" height="155" rx="8" fill="url(#bar3Grad)" />

    <!-- Bar Highlight Caps -->
    <circle cx="201" cy="213" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="256" cy="168" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="311" cy="133" r="5" fill="#FFFFFF" fill-opacity="0.8" />
  </g>

  <!-- Main Open Book Wings -->
  <!-- Back/Shadow Pages -->
  <path d="M256 372 C210 348 140 346 92 364 C83 367 74 360 74 350 V245 C74 236 82 229 91 226 C143 209 211 216 256 242 Z" fill="#1E1B4B" fill-opacity="0.7" />
  <path d="M256 372 C302 348 372 346 420 364 C429 367 438 360 438 350 V245 C438 236 430 229 421 226 C369 209 301 216 256 242 Z" fill="#2E1065" fill-opacity="0.7" />

  <!-- Mid Page Layer Left -->
  <path d="M256 360 C212 338 148 336 102 352 C94 355 86 348 86 339 V232 C86 224 93 218 101 215 C150 198 214 205 256 230 Z" fill="url(#pageLayerLeft)" />
  <!-- Mid Page Layer Right -->
  <path d="M256 360 C300 338 364 336 410 352 C418 355 426 348 426 339 V232 C426 224 419 218 411 215 C362 198 298 205 256 230 Z" fill="url(#pageLayerRight)" />

  <!-- Front Main Cover Page (Left: Indigo) -->
  <path d="M256 348 C215 328 156 326 112 340 C104 343 96 336 96 328 V220 C96 212 103 206 111 204 C158 188 217 195 256 218 Z" fill="url(#leftWing)" />
  <!-- Front Main Cover Page (Right: Purple) -->
  <path d="M256 348 C297 328 356 326 400 340 C408 343 416 336 416 328 V220 C416 212 409 206 401 204 C354 188 295 195 256 218 Z" fill="url(#rightWing)" />

  <!-- Book Spine Center Fold -->
  <path d="M256 218 L256 352" stroke="#1E1B4B" stroke-width="4" stroke-linecap="round" />

  <!-- Sleek Golden Bookmark Ribbon Extends Down -->
  <path d="M246 222 L266 222 L266 382 L256 370 L246 382 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />

  <!-- Stylized Lines Representing Text & Content on Pages -->
  <!-- Left Page Lines -->
  <path d="M132 236 C168 226 208 230 236 244" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75" />
  <path d="M132 260 C168 250 208 254 236 268" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M132 284 C168 274 208 278 236 292" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55" />
  <path d="M142 308 C172 300 204 304 228 314" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45" />

  <!-- Right Page Lines -->
  <path d="M380 236 C344 226 304 230 276 244" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75" />
  <path d="M380 260 C344 250 304 254 276 268" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M380 284 C344 274 304 278 276 292" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55" />
  <path d="M370 308 C340 300 308 304 284 314" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45" />

  <!-- Crown / Niche Star of Excellence on Top of the Book (Symbol of Niche Discovery & #1 Bestseller) -->
  <g filter="url(#goldGlow)">
    <!-- 4-Point Radiant North Star -->
    <path d="M256 76 Q256 112 280 112 Q256 112 256 148 Q256 112 232 112 Q256 112 256 76 Z" fill="url(#goldGrad)" />
    <!-- Center Core Diamond -->
    <rect x="251" y="107" width="10" height="10" transform="rotate(45 256 112)" fill="#FFFFFF" />

    <!-- Diagonal Micro Sparkle Rays -->
    <path d="M242 98 L270 126 M270 98 L242 126" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Accent Sparkles (Niche Gems) -->
  <!-- Top Left Sparkle -->
  <g filter="url(#cyanGlow)">
    <path d="M120 120 Q120 134 130 134 Q120 134 120 148 Q120 134 110 134 Q120 134 120 120 Z" fill="#38BDF8" />
  </g>

  <!-- Top Right Sparkle -->
  <g filter="url(#goldGlow)">
    <path d="M392 116 Q392 128 402 128 Q392 128 392 140 Q392 128 382 128 Q392 128 392 116 Z" fill="#FBBF24" />
  </g>

  <!-- PRO Gold Emblem Badge at Bottom Right Corner -->
  <g transform="translate(322, 386)" filter="url(#shadowDepth)">
    <rect width="112" height="42" rx="21" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    <rect x="2" y="2" width="108" height="38" rx="19" fill="#0F172A" />
    <text x="56" y="26" fill="url(#goldGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" letter-spacing="3" text-anchor="middle">PRO</text>
  </g>
</svg>